name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build macOS app
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve SwiftPM dependencies
        run: >
          xcodebuild -resolvePackageDependencies
          -project ImageManager.xcodeproj
          -scheme ImageManager

      - name: Build (Debug)
        run: >
          xcodebuild -project ImageManager.xcodeproj
          -scheme ImageManager
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build (Release)
        run: >
          xcodebuild -project ImageManager.xcodeproj
          -scheme ImageManager
          -configuration Release
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build
