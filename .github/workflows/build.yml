name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build macOS app
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve SwiftPM dependencies
        run: >
          xcodebuild -resolvePackageDependencies
          -project SqueezeBatch.xcodeproj
          -scheme SqueezeBatch

      - name: Build (Debug)
        run: >
          xcodebuild -project SqueezeBatch.xcodeproj
          -scheme SqueezeBatch
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build (Release)
        run: >
          xcodebuild -project SqueezeBatch.xcodeproj
          -scheme SqueezeBatch
          -configuration Release
          -destination 'platform=macOS'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package unsigned .app for download
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/SqueezeBatch.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "build/SqueezeBatch-unsigned-macOS.zip"
          ls -lh build/*.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SqueezeBatch-unsigned-macOS
          path: build/SqueezeBatch-unsigned-macOS.zip
          retention-days: 14
